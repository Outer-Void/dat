[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "outervoid-dat"
version = "4.0.0"
description = "DAT: deterministic quality, security and release audits (standalone; BLUX capability adapter)"
readme = "README.md"
authors = [{ name = "Outer Void", email = "outervoid.blux@gmail.com" }]
# Licence unchanged from the existing LICENSE file; any change is an owner decision (credits UNR-008).
license = "LicenseRef-OuterVoid-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# No runtime dependencies: DAT must work offline, without BLUX, CogA, cA or any AI service.
dependencies = []
keywords = ["security", "audit", "release", "secrets", "sarif"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "jsonschema>=4.20", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/Outer-Void/dat"
Repository = "https://github.com/Outer-Void/dat"
Changelog = "https://github.com/Outer-Void/dat/blob/main/CHANGELOG.md"

[project.scripts]
dat = "dat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dat*"]

[tool.setuptools.package-data]
dat = ["schemas/*.json", "py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tools/dat2lrc.py", "snapshot.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "A", "BLE", "RUF", "SIM", "PL", "C4", "N"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLC0415", "S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "BLE", "PLW1510", "N"]

[tool.ruff.lint.isort]
known-first-party = ["dat"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
packages = ["dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
