name: Release verification

# OV-63 (owner decision 2026-11-09): DAT releases are built, checked independently and signed offline with the
# shared release tool (Outer-Void/docs tools/release_pipeline.py) and an Ed25519 key that never leaves the owner's
# machine. This workflow never signs and never publishes. On a version tag it rebuilds DAT from the tag and fails
# unless the result matches the signed SHA256SUMS and receipt recorded in Outer-Void/docs releases/dat/<version>/.
# Before OV-63 it published whatever it built, and skipped signing silently when the key secret was absent.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: dat
      - uses: actions/checkout@v4
        with:
          repository: Outer-Void/docs
          path: docs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests (independent of DAT's verdict on itself)
        working-directory: dat
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Rebuild and check against the signed release record
        run: |
          version="${GITHUB_REF_NAME#v}"
          python docs/tools/release_pipeline.py verify --release "docs/releases/dat/${version}" --rebuild dat
