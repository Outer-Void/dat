name: CI

on:
  push:
    branches: ["main", "stage-*/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          # Contract v1 SDK, only to validate .blux/ in tests. DAT itself never imports it.
          pip install "blux-sdk @ git+https://github.com/Outer-Void/blux.git@0b09a46a98a29cbdb108679f3ef5252b0b6881d1#subdirectory=sdk/python"
      - name: Lint and types
        run: make lint types
      - name: Tests
        env:
          DAT_REQUIRE_BLUX_SDK: "1"
        run: make test
      - name: Wheel
        run: make wheel
      - name: DAT audits itself (release gate)
        run: make selfaudit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dat-sarif-${{ matrix.python-version }}
          path: dat.sarif
