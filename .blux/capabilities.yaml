# DAT capabilities for BLUX (docs/BLUX.md). Every capability is deterministic and read-only.
# A failed gate is a successful audit (verdict: fail). DAT failing to audit is a BLUX FAILURE.
contract: blux.capability-set
contract_version: "1.0"
capabilities:
  - contract: blux.capability
    contract_version: "1.0"
    capability_id: repo.audit
    version: 4.0.0
    summary: "Full repository audit: security, quality, packaging and release findings."
    contract_versions: ["1.0"]
    input_schema:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target: {type: string, minLength: 1, maxLength: 4096, description: "Path to audit (relative to the caller's working directory)."}
        policy: {type: string, minLength: 1, maxLength: 4096, description: "dat.policy JSON file."}
        use_target_policy: {type: boolean, description: "Load TARGET/.dat/policy.json when no policy is given (default true)."}
        fail_on: {enum: ["info", "low", "medium", "high", "critical"]}
        min_confidence: {enum: ["low", "medium", "high"]}
    output_schema:
      type: object
      required: [contract, version, tool, capability, target, outcome, gate, summary, findings, suppressed, analyzers, errors, linkage]
      properties:
        contract: {const: dat.report}
        version: {const: 1}
        outcome: {const: completed}
        gate:
          type: object
          required: [verdict, blocking, fail_on, min_confidence]
          properties:
            verdict: {enum: [pass, fail]}
            blocking: {type: integer, minimum: 0}
        findings:
          type: array
          items:
            type: object
            required: [rule_id, category, severity, confidence, message, location, fingerprint]
            properties:
              severity: {enum: ["info", "low", "medium", "high", "critical"]}
              confidence: {enum: ["low", "medium", "high"]}
              fingerprint: {type: string, pattern: "^[0-9a-f]{64}$"}
        errors: {type: array, maxItems: 0}
        linkage:
          type: object
          required: [operation_id, capability_id, system]
    side_effects: read
    required_permissions: ["fs:read:target"]
    idempotent: true
    timeout_ms: 600000
    provider:
      repository: Outer-Void/dat
      kind: subprocess
      entrypoint: dat blux-capability repo.audit
    labels:
      authority: deterministic
